# Single-test Local STS validation suite for density_pa_light_gvisor.
tests:
  - name: density_pa_light_gvisor
    type: locust
    description: "Actor density limit: personal-assistant-light on 1 gVisor worker"
    targetCluster: dev
    sandboxClass: gvisor
    file: /app/tests/agentsession.py
    duration: 120m
    users: 1024
    workerCount: 1
    actorCPU: "250m"
    runnerCpu: "4"
    runnerMemory: "8Gi"
    ateArgs:
      - "--cordon-system-infra-components"
    flags:
      - "--density-step-duration"
      - "5m"
      - "--spawn-rate"
      - "64"
      - "--agentsession-script"
      - "personal-assistant-light"
      - "--agentsession-think-scale"
      - "0.005"
      - "--agentsession-phase-in"
      - "90"
      - "--resume-mode"
      - "implicit"
